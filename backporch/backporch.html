        :root{
          --void:#2B0040;
          --void-deep:#150022;
          --hot:#FF003C;
          --acid:#39FF14;
          --cyan:#00F0FF;
          --paper:#F5EFFF;
          color-scheme: dark;
          /* keep safe-area vars for notched phones */
          --safe-top: env(safe-area-inset-top, 0px);
          --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* --- phone overflow safety --- */
        html, body {
          overflow-x: hidden; /* fix horizontal scroll on iOS */
          max-width: 100vw;
        }
        html {
          scroll-padding-top: var(--safe-top);
          box-sizing: border-box;
        }
        *, *::before, *::after {
          box-sizing: inherit;
          overflow-wrap: break-word; /* word-wrap safety */
          word-break: break-word;
        }

        body {
          margin:0;
          background:var(--void);
          background-image:
            radial-gradient(ellipse at 15% 0%, rgba(255,0,60,0.12), transparent 55%),
            radial-gradient(ellipse at 85% 15%, rgba(0,240,255,0.10), transparent 50%);
          color:var(--paper);
          font-family: Georgia, "Times New Roman", serif;
          line-height:1.6;
          padding-top: var(--safe-top);
          padding-bottom: var(--safe-bottom);
        }

        a{color:var(--cyan); text-decoration: none;}
        a:hover{color:var(--hot);}

        /* HEADER — flex with gap, wraps cleanly */
        .site-header{
          background:var(--void-deep);
          border-bottom:2px solid var(--hot);
          padding:14px 20px;
          padding-top: calc(14px + var(--safe-top));
          width:100%;
          max-width:100vw;
        }
        .nav{
          max-width:1200px;
          margin:0 auto;
          display:flex;
          justify-content:space-between;
          align-items:center;
          flex-wrap:wrap; /* allow clean wrap */
          gap:12px 20px;
        }
        .brand{
          font-family:Georgia,serif;
          font-weight:700;
          font-size:18px;
          letter-spacing:1px;
          color:var(--paper);
          line-height:1.2;
          overflow-wrap:anywhere;
        }
        .navlinks{
          display:flex;
          flex-wrap:wrap; /* prevent overflow */
          align-items:center;
          gap:6px 14px;
        }
        .navlinks a{
          font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
          font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
          color:#C9B8E0;
          padding:4px 2px;
          white-space:nowrap;
        }
        .navlinks a:hover{color:var(--hot);}
        .navlinks a.current{color:var(--acid);}

        .wrap{max-width:1200px;margin:0 auto;padding:0 20px; width:100%;}

        /* HERO — keep identity, reduce clipping on phone */
        .hero{position:relative;padding:70px 20px 50px;overflow:hidden; max-width:100vw;}
        .hero .kicker{
          font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
          font-size:12px;letter-spacing:3px;color:var(--acid);font-weight:700;
          margin-bottom:18px;
        }
        .hero h1{
          font-family: Impact, "Arial Narrow Bold", "Helvetica Neue", sans-serif;
          font-weight:400;
          font-size:clamp(52px,10vw,120px);
          line-height:0.85;
          letter-spacing:1px;
          color:var(--hot);
          text-shadow: 4px 4px 0 var(--void-deep), 7px 7px 0 var(--cyan);
          transform:rotate(-3deg);
          display:inline-block;
          margin:0 0 10px -4px;
          max-width:100%;
        }
        .hero p.tag{
          font-size:19px;
          font-style:italic;
          color:var(--paper);
          max-width:520px;
        }
        .stamp{
          position:absolute; top:28px; right:24px;
          border:3px solid var(--acid);
          color:var(--acid);
          border-radius:50%;
          width:110px;height:110px;
          display:flex;align-items:center;justify-content:center;text-align:center;
          font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
          font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
          transform:rotate(12deg);
          line-height:1.3;
          flex-shrink:0;
        }

        /* TICKER — fixed: no padding-left:100%, no iOS scroll */
        .ticker-band{
          background:var(--hot); color:var(--void-deep);
          overflow:hidden; /* critical */
          white-space:nowrap;
          padding:9px 0;
          border-top:2px solid var(--void-deep);
          border-bottom:2px solid var(--void-deep);
          max-width:100vw;
          width:100%;
          position:relative;
        }
        .ticker-track{
          display:inline-flex; /* not block + padding-left */
          align-items:center;
          width:max-content; /* auto width, not 100% + padding */
          will-change: transform;
          font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
          font-weight:800; font-size:13px; letter-spacing:1px; text-transform:uppercase;
          animation: scroll-left 26s linear infinite;
        }
        .ticker-track span{margin-right:60px; flex-shrink:0;}
        @keyframes scroll-left{
          from{transform:translateX(0);}
          to{transform:translateX(-50%);} /* works because headlines duplicated */
        }
        @media (prefers-reduced-motion: reduce){
          .ticker-track{animation:none;}
        }

        /* STORY GRID — breakpoint earlier at 768px */
        .grid{
          display:grid; grid-template-columns:repeat(3,1fr); gap:28px;
          padding:60px 20px 20px;
          max-width:100%;
        }
        .card{
          background:var(--void-deep);
          border:1px solid rgba(245,239,255,0.15);
          padding:26px 24px;
          min-width:0; /* prevent grid blowout */
        }
        .card:nth-child(2){transform:rotate(0.6deg);}
        .card:nth-child(3){transform:rotate(-0.5deg);}
        .card .label{
          display:inline-block;
          font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
          font-size:10px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
          color:var(--void-deep); background:var(--acid);
          padding:3px 8px; margin-bottom:14px;
        }
        .card h2{
          font-family:Georgia,serif; font-weight:700; font-style:italic;
          font-size:24px; line-height:1.15; color:var(--paper); margin:0 0 12px;
          overflow-wrap:anywhere;
        }
        .card p{font-size:15px; color:#D9CCEE; margin:0;}
        .card .byline{
          display:block; margin-top:16px;
          font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
          font-size:11px; letter-spacing:1px; color:var(--cyan);
        }
        /* phone-friendly images */
        .card img{
          max-width:100%;
          height:auto;
          display:block;
          margin:12px 0;
          border-radius:2px;
          width:100%;
          object-fit:cover;
        }

        /* PULL QUOTE */
        .banner-quote{
          margin:60px 0 0; padding:34px 20px;
          background:var(--void-deep);
          border-top:2px solid var(--acid); border-bottom:2px solid var(--acid);
          text-align:center;
          max-width:100vw;
        }
        .banner-quote blockquote{
          font-family:Georgia,serif; font-style:italic;
          font-size:clamp(20px,3.4vw,34px); color:var(--cyan); max-width:780px;
          margin:0 auto;
        }

        footer{padding:40px 20px 30px; text-align:center; padding-bottom: calc(30px + var(--safe-bottom));}
        .footer-brand{
          font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
          font-size:12px; font-weight:800; letter-spacing:2px; color:var(--hot);
        }
        .small{font-size:11px; color:#9C86BE; margin-top:6px;}

        /* --- PHONE FIRST FIXES --- */
        @media(max-width:768px){
          .grid{grid-template-columns:1fr; gap:16px; padding:24px 16px 20px;}
          .card{transform:none !important;} /* remove rotates that cause overflow on mobile */
          .banner-quote{margin:32px 0 0;}
        }

        @media(max-width:600px){
          /* header brand full width, navlinks wrap with gap */
          .site-header{padding:10px 16px; padding-top: calc(10px + var(--safe-top));}
          .nav{flex-direction:column; align-items:flex-start; gap:10px;}
          .brand{width:100%; font-size:14px; letter-spacing:0.8px; line-height:1.15;}
          .navlinks{width:100%; gap:6px 14px;}
          .navlinks a{font-size:10px; margin-left:0 !important; letter-spacing:1.2px;}

          .wrap{padding:0 16px;}

          /* hero tighter, h1 smaller shadow, less rotate */
          .hero{padding:40px 16px 32px;}
          .hero h1{
            font-size:clamp(42px,14vw,72px);
            margin:0 0 10px 0; /* remove negative margin that clips */
            transform:rotate(-1.5deg);
            text-shadow: 2px 2px 0 var(--void-deep), 3px 3px 0 var(--cyan);
          }
          .hero p.tag{font-size:16px; max-width:100%;}
          .hero .kicker{font-size:11px; letter-spacing:2px; margin-bottom:12px;}

          /* stamp static + smaller on mobile */
          .stamp{
            position:static;
