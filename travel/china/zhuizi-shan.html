-[1.78] tracking-[-0.011em] text-[#1a1a1a]/90",children:[g("p",{className:"first-letter:font-garamond first-letter:float-left first-letter:text-[72px] first-letter:leading-[0.8] first-letter:tracking-[-0.04em] first-letter:font-bold first-letter:mr-[10px] first-letter:mt-[6px] first-letter:text-[#1a1a1a]",children:"I spent three months with a map that turned out to be mostly decorative. It was printed in Beijing in 1978, hand-colored, with contour lines that suggested confidence where there was none. The mountain labeled Zhuizi Shan sat in the middle of a beige patch that the cartographer had clearly gotten bored with. No roads in. No roads out. A single dotted line that, on closer inspection, was a printing error."}),g("p",{className:"mt-6",children:"The train to Liaoning was built for a smaller generation. Knees to chest for nine hours, watching cornfields blur past the window. The conductor sold hard-boiled eggs from a plastic bucket. At Liaoyang I got off because the timetable said I should, not because anything outside looked like a town that would know about Zhuizi Shan. It didn't."}),g("p",{className:"mt-6",children:"The taxi was arranged through a friend of a friend who knew a guy who had once delivered fertilizer in that direction. He dropped me where the pavement ended — literally. One minute asphalt, next minute a wall of corn. He pointed at the stalks, said “Zhuizi Shan” with a shrug that meant “good luck,” and left me with my pack in a field buzzing with cicadas. The corn was taller than me. There was no path."}),z("div",{className:"my-9 py-6 border-y border-[#1a1a1a]/10 flex gap-4",children:[g("div",{className:"font-garamond text-[30px] leading-none text-[#1a1a1a]/15 select-none",children:"“"}),z("blockquote",{className:"font-garamond text-[24px] sm:text-[27px] leading-[1.28] tracking-[-0.02em] italic text-[#1a1a1a]",children:["She worked the clutch like a rally racer. Up one car length and then a slide back half.",g("footer",{className:"mt-3 font-inter not-italic text-[11px] tracking-[0.14em] uppercase text-[#1a1a1a]/40",children:"— Notebook, Day 3, 2:14pm"})]})]}),g("p",{className:"mt-6",children:"I pushed through for an hour until I hit a dirt track. That's where I found the meeting. Three taxi drivers parked nose-to-nose in the middle of nowhere, trunks open, smoking, arguing over my map. They each had a different idea of where the road had been before the rains in '21 washed it out. One traced a route with his cigarette. The other two laughed. They finally agreed to charge me triple to take me to “the village near the mountain” — which, it turned out, was four different villages depending on who you asked."}),g("p",{className:"mt-6",children:"The village chief put me in an outbuilding that had been a pig shelter, then storage, then nothing. Six days. The roof leaked in a way that felt personal. He brought me hot water twice a day and asked, each time, when I was leaving. I spent the days walking ridgelines with a local kid who knew the mountain as “the place where the signal dies.” We found pottery shards, a rusted sickle, and a lot of false summits that looked right on the Beijing map."}),g("p",{className:"mt-6",children:`On the fourth morning, she showed up. I never got her real name — everyone called her Xiao Hong. Early 60s, 4'11", drove a red Wuling that should have been retired years ago. 1.2 liters, no synchro on second, bald front tires. The chief had called her because she was the only person in the county who would still try the old mining road. She looked at my pack, looked at the mountain barely visible through haze, and said “Shang.” Up.`}),g("p",{className:"mt-6",children:"The road wasn't a road. It was a suggestion that had been driven over by trucks too heavy for it for too long. Loose shale, ruts deep enough to swallow a wheel, and a grade that kept getting steeper just as you thought it would level. Xiao Hong never stopped smiling. She worked the clutch like a rally racer. Up one car length and then a slide back half. The smell of burning clutch filled the cabin. I was bracing against the dash. She was humming."}),g("p",{className:"mt-6",children:"We made it to 680 meters when the car finally said no. She popped the hood, poured water from a tea thermos onto the radiator, and told me to walk the rest. From there it was another hour on foot through scrub oak. And then, just below the false top, it was there: a rubble wall. Not Ming. Older. Stones laid without mortar, lichen-covered, following the ridgeline for 200 meters before disappearing into brush. The oldest section — the part that had been hidden on every map — was only about eight courses high, but it was clearly defensive, clearly old, and clearly not supposed to be there according to every official record I'd read."}),g("p",{className:"mt-6",children:"I sat with it for a long time. The wind came up. On the other side of the ridge — the north side I couldn't see from below — there was a paved road. Freshly laid. Guardrails, reflectors, a sign in English that said “Scenic Overlook 300m.” Of course there was a paved road. There had always been a paved road. We had just come up the hard way because no map shows you the easy way when you're looking for something that isn't supposed to exist."}),g("p",{className:"mt-6",children:"On the way down, at the trailhead that I now knew was a proper trailhead, there was a brand new sign. White with red letters: NO CAMPING. It had been installed that morning. The concrete at the base was still wet. I had camped 20 meters from it the night before. The worker installing it saw my tent footprints and just nodded. He didn't care."}),g("p",{className:"mt-6",children:"Never trust a map. Trust the red car. Trust the burning clutch. Trust the woman who hums while driving straight up a mountain. The journey is worth taking precisely because the map was wrong. If it had been right, I would have taken the paved road, seen the overlook, and missed the wall entirely."}),z
